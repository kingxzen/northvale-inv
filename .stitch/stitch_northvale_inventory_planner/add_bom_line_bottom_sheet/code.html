<div class="grid grid-cols-3 gap-sm">

<!-- UI Overlay Assets (Simulating active interaction) -->
<script>
        function closeSheet() {
            const sheet = document.getElementById('bottom-sheet');
            const backdrop = document.getElementById('backdrop');
            
            sheet.style.transform = 'translateY(100%)';
            backdrop.style.opacity = '0';
            
            setTimeout(() => {
                sheet.style.display = 'none';
                backdrop.style.display = 'none';
            }, 400);
        }

        // Section Toggles
        const sectionButtons = document.querySelectorAll('[type="button"]');
        sectionButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                sectionButtons.forEach(b => {
                    b.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-[0_0_15px_rgba(2,103,184,0.3)]');
                    b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                });
                btn.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-[0_0_15px_rgba(2,103,184,0.3)]');
                btn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
            });
        });

        // Simple form validation/submission feel
        document.getElementById('bom-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Added';
                btn.classList.replace('bg-primary', 'bg-emerald-500');
                setTimeout(closeSheet, 800);
            }, 1000);
        });

        // Initialize sheet state
        window.onload = () => {
            const sheet = document.getElementById('bottom-sheet');
            sheet.style.transform = 'translateY(100%)';
            setTimeout(() => {
                sheet.style.transform = 'translateY(0)';
            }, 50);
        };
    </script>
