<script>
        // Subtle micro-interaction for inputs
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
            });
            el.addEventListener('blur', () => {
                el.parentElement.querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
            });
        });

        // Click interaction for chips
        document.querySelectorAll('.flex.flex-wrap button').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.flex.flex-wrap button').forEach(c => {
                    c.className = "bg-surface-variant/30 text-on-surface-variant border border-outline-variant/30 px-md py-1 rounded-full font-label-md hover:bg-surface-variant/50 transition-all active:scale-95";
                });
                chip.className = "bg-secondary-container/20 text-on-secondary-container border border-secondary-container/50 px-md py-1 rounded-full font-label-md transition-all active:scale-95";
            });
        });
