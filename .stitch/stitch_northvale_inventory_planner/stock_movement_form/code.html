<script>
        // Simple Interaction Logic
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.closest('.bg-surface-container')) {
                    // Logic for the segmented toggle
                    this.parentElement.querySelectorAll('button').forEach(b => {
                        b.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'shadow-lg');
                        b.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/50');
                    });
                    this.classList.add('bg-secondary-container', 'text-on-secondary-container', 'shadow-lg');
                    this.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/50');

                    // Show warning if "Adjustment" is clicked
                    const warning = document.getElementById('adjustment-warning');
                    if (this.textContent === 'Adjustment') {
                        warning.classList.remove('hidden');
                        warning.classList.add('flex');
                    } else {
                        warning.classList.add('hidden');
                        warning.classList.remove('flex');
                    }
                }
            });
        });

        // Input effect for Quantity
        const qtyInput = document.getElementById('qty');
