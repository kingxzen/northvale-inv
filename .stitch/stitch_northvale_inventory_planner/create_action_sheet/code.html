<script>
        const backdrop = document.getElementById('backdrop');
        const actionSheet = document.getElementById('actionSheet');
        const closeBtn = document.getElementById('closeBtn');

        function closeSheet() {
            actionSheet.style.animation = 'none';
            actionSheet.offsetHeight; // trigger reflow
            actionSheet.style.transition = 'transform 0.3s ease-in';
            actionSheet.style.transform = 'translateY(100%)';
            backdrop.style.opacity = '0';
            setTimeout(() => {
                // In a real app we'd remove from DOM or toggle visibility
                console.log('Action sheet closed');
            }, 300);
        }

        backdrop.addEventListener('click', closeSheet);
        closeBtn.addEventListener('click', closeSheet);

        // Individual action clicks
        document.querySelectorAll('button:not(#closeBtn)').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const label = btn.querySelector('.font-label-md').innerText;
                console.log(`Action selected: ${label}`);
                // Simple ripple/active effect is handled by Tailwind 'active:scale'
            });
        });
